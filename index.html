<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Guide for You</title>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f7f7f7; }
  .container { max-width: 480px; margin: 40px auto; background:#fff; padding:20px; border-radius:12px; box-shadow:0 0 12px rgba(0,0,0,0.1); text-align:center; }
  h1 { font-size:22px; color:#333; margin-bottom:10px; }
  p { font-size:16px; color:#555; margin-bottom:20px; }
  input[type=text], input[type=email] { width: 100%; padding:12px; margin:5px 0 15px 0; border:1px solid #ccc; border-radius:6px; font-size:16px; }
  button { background:#28a745; color:#fff; border:none; padding:14px 22px; font-size:16px; border-radius:6px; cursor:pointer; width:100%; }
  button:hover { background:#218838; }
  .trust { font-size:14px; color:#888; margin-top:15px; }

<body>

<div class="container">
  <h1>Get Your Free Guide!</h1>

  <!-- FB内嵌兼容表单 -->

  <div class="trust">
